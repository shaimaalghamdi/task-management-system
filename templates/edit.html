<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Edit Task</h1>

        <form action="/edit/{{ task['id'] }}" method="POST">

            <input
                type="text"
                name="title"
                value="{{ task['title'] }}"
                placeholder="Task title"
                required
            >

            <br><br>

            <textarea
                name="description"
                placeholder="Task description"
            >{{ task["description"] or "" }}</textarea>

            <br><br>

            <select name="status">

                <option value="Pending"
                    {% if task["status"] == "Pending" %}selected{% endif %}>
                    Pending
                </option>

                <option value="In Progress"
                    {% if task["status"] == "In Progress" %}selected{% endif %}>
                    In Progress
                </option>

                <option value="Completed"
                    {% if task["status"] == "Completed" %}selected{% endif %}>
                    Completed
                </option>

            </select>

            <select name="priority">

                <option value="Low"
                    {% if task["priority"] == "Low" %}selected{% endif %}>
                    Low
                </option>

                <option value="Medium"
                    {% if task["priority"] == "Medium" %}selected{% endif %}>
                    Medium
                </option>

                <option value="High"
                    {% if task["priority"] == "High" %}selected{% endif %}>
                    High
                </option>

            </select>

            <input
                type="date"
                name="due_date"
                value="{{ task['due_date'] or '' }}"
            >

            <br><br>

            <button type="submit">Save Changes</button>

        </form>

        <br>

        <a href="/">Back to Tasks</a>

    </div>

</body>
</html>
